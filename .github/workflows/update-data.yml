name: Update macro data

on:
  schedule:
    # 每日 09:00 UTC ＝ 台北時間 17:00（台股收盤後、多數政府統計於當日上午發布後）
    - cron: "0 9 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/fetch_data.py"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests certifi xlrd

      - name: Fetch, commit & push (retried as a unit to survive concurrent runs)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3 4 5; do
            python scripts/fetch_data.py

            if git diff --quiet -- data/ && [ -z "$(git status --porcelain data/)" ]; then
              echo "No data changes."
              exit 0
            fi

            git add data/
            git commit -m "chore: update macro data ($(date -u +'%Y-%m-%d %H:%M UTC'))"

            if git push; then
              exit 0
            fi

            # 與其他同時觸發的執行序列競速（例如手動 dispatch 剛好碰上排程或另一次 push）
            # 時才會走到這裡：捨棄本地這個 commit，重新對齊遠端最新狀態後，
            # 重跑一次擷取腳本再重試，而非嘗試合併兩份彼此獨立產生的 JSON diff。
            echo "Push rejected (attempt $i), resetting onto latest origin/main and retrying..."
            git fetch origin main
            git reset --hard origin/main
            sleep $((i * 5))
          done
          echo "::error::Failed to push data update after retries."
          exit 1
